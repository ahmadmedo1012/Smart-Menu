name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# round86-D6: superseded runs are cancelled instead of queueing ~20min each
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.x"

# round86-D6: least-privilege token permissions
permissions:
  contents: read

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: smart-menu-test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      # Project uses pnpm (pnpm-lock.yaml is the only lockfile — no
      # package-lock.json), so CI must install and cache through pnpm too.
      # npm ci fails hard with "Dependencies lock file is not found".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # round88-D6: secret-leak scanner (scripts/check-secrets.mjs) —
      # zero-dependency (node builtins + git), scans every tracked file for
      # GitHub/Vercel/OpenAI tokens and credentialed DB URLs. Placed BEFORE
      # install/build (fail-fast: a leaked token fails the run in seconds,
      # before minutes of dependencies/build); like the .env guard below it
      # is security-relevant and costs ~1s. Exit 1 on any real leak —
      # deliberate dev-only placeholders live in the script's reviewed
      # FILE_ALLOWLIST / inline `allow-secret-check` markers.
      - name: Secrets scan
        run: node scripts/check-secrets.mjs

      # round86-D6: cache the chromium browser between runs (install step
      # below becomes a no-op hit)
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile

      # round86-D6: fail-fast ordering — the committed-.env guard is
      # security-relevant and takes milliseconds; it must not wait behind a
      # multi-minute build
      - name: Check for committed .env files
        run: |
          STAGED=$(git ls-files '.env' '.env.local' '.env.prod' '.env.development')
          if [ -n "$STAGED" ]; then
            echo "❌ SECURITY BLOCKED: .env files are tracked:"
            echo "$STAGED"
            exit 1
          fi

      # round86-D7: dependency audit (prod tree) — new advisories fail CI
      - run: pnpm audit --prod

      # prisma.config.ts resolves DATABASE_URL at load time (PrismaConfigEnvError
      # otherwise), even for `generate` which never touches the DB — a dummy URL
      # satisfies the config loader in CI.
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/smart-menu-test

      # round87-D10: migration parity gate — schema.prisma must match what the
      # migrations directory actually produces. `prisma migrate diff` replays
      # ALL migrations into a scratch shadow DB on the SAME postgres service
      # and diffs the result against the datamodel; --exit-code makes any drift
      # (hand-written migration SQL whose names/objects differ from the schema,
      # or a schema edit shipped without a migration) fail CI with exit 2.
      # Incantation documented in docs/ops-runbook.md §3. prisma.config.ts reads
      # SHADOW_DATABASE_URL, and DATABASE_URL is required at config-load time.
      - name: Migration parity gate (migrations ↔ schema.prisma)
        run: |
          node -e "const {Client}=require('pg');(async()=>{const c=new Client({connectionString:process.env.DATABASE_URL});await c.connect();await c.query('DROP DATABASE IF EXISTS \"smart-menu-shadow\"');await c.query('CREATE DATABASE \"smart-menu-shadow\"');await c.end();})().catch((e)=>{console.error(e);process.exit(1)})"
          pnpm exec prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema prisma/schema.prisma \
            --exit-code
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/smart-menu-test
          SHADOW_DATABASE_URL: postgresql://test:test@localhost:5432/smart-menu-shadow

      # Schema must exist before build: /menu/[slug] generateStaticParams reads
      # the DB at build time (TableDoesNotExist otherwise). Use the SAME channel
      # as production — `prisma migrate deploy` (package.json build runs it too):
      # a previous `prisma db push` step created the schema WITHOUT the
      # _prisma_migrations table, so the build's own `migrate deploy` then failed
      # with P3005 ("database schema is not empty") on every CI run.
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/smart-menu-test

      # CI/local seed (admin + default plans) without the /api/seed admin-auth
      # chicken-and-egg. E2E auth suites log in as this admin.
      - run: node scripts/ci-seed.mjs
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/smart-menu-test

      # round85-D5: seed a REAL restaurant (al-waha-cafe + 9 items + featured
      # showcase) so localhost e2e menu/cart journeys run against data instead
      # of every /menu/<slug> check passing via the 404 branch.
      # Note: this seed writes a LEGACY-format password hash on purpose —
      # login then exercises the round85-A3 legacy-verify + rehash-on-login path.
      - run: node scripts/round83-seed.mjs
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/smart-menu-test

      # round86-D2: fixture for the localhost deep journeys (qa-teams specs
      # hardcode testmulti1568 + restaurants 313..317 for the IDOR checks)
      - run: node scripts/qa-seed.mjs
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/smart-menu-test

      - run: npm run lint

      # round85-D2: typecheck was never in CI (tsconfig excludes tests/e2e,
      # scripts — those are checked by their own runners)
      - run: npm run typecheck

      # round85-A7 (hardened round86-A12 to PER-HANDLER checks): every exported
      # HTTP handler must be session-gated, secret-gated, or a documented
      # public endpoint — catches "forgot requireAuth on one verb" regressions
      - run: node scripts/check-api-auth.mjs

      # round86-D5: coverage WITH thresholds — `npm test` (plain run) never
      # executed the ratchet, so a 0%-covered module failed nothing
      - run: npm run test:coverage
        env:
          TELEGRAM_BOT_TOKEN: "test"
          TELEGRAM_CHAT_ID: "0"

      # Build-time env validation (src/lib/env.ts) throws in production mode —
      # supply CI-safe values so page-data collection can import API routes.
      # These are placeholders only; the E2E server step sets its own.
      - run: npm run build
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/smart-menu-test
          JWT_SECRET: test-secret-for-ci-min-32-chars-long
          AUTH_SECRET: test-auth-secret-for-ci-min-32-chars
          NEXT_PUBLIC_DOMAIN: http://localhost:3000
          NEXT_PUBLIC_WHATSAPP_NUMBER: "218900000000"

      # Start server for E2E tests (always runs, uses CI Postgres service).
      # Standalone server (output: standalone) — `next start` warns and can
      # misbehave with it. NOTE: the standalone server is a NEW process —
      # build-time env does NOT carry over, and src/lib/env.ts validates
      # NEXT_PUBLIC_WHATSAPP_NUMBER at RUNTIME too; without it every
      # env-validating route 500s (verified: CI run 498 webhook/login tests).
      # round87-D3: wait-on was fetched from the npm registry at RUNTIME via
      # unpinned `npx wait-on` (outside any lockfile/minimumReleaseAge policy);
      # it is now an exact-pinned devDependency (9.1.0) and invoked through the
      # local binary — no network fetch, no version drift.
      - name: Start server for E2E
        run: |
          node .next/standalone/server.js &
          pnpm exec wait-on http://localhost:3000 --timeout 60000
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/smart-menu-test
          JWT_SECRET: test-secret-for-ci-min-32-chars-long
          AUTH_SECRET: test-auth-secret-for-ci-min-32-chars
          NEXT_PUBLIC_DOMAIN: http://localhost:3000
          NEXT_PUBLIC_WHATSAPP_NUMBER: "218900000000"
          TELEGRAM_BOT_TOKEN: "test"

      # E2E tests against localhost (not production).
      # DB-backed via the CI Postgres service at top of this job.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests (core projects)
        run: npm run test:e2e
        env:
          BASE_URL: http://localhost:3000
          DATABASE_URL: postgresql://test:test@localhost:5432/smart-menu-test
          JWT_SECRET: test-secret-for-ci-min-32-chars-long
          NEXT_PUBLIC_DOMAIN: http://localhost:3000

      # round86-D2: the deep journeys (payments/owner-CRUD/IDOR/personas) were
      # LOCAL-ONLY before — CI never executed ~63 cases, including the
      # team4 payments flow and the round80/86 security suites. Runs against
      # the same CI server (seeds already loaded), so it is a BLOCKING gate.
      - name: E2E deep journeys (qa-teams + security suites, localhost)
        run: npx playwright test --project=qa-teams --project=round79-c --workers=2
        env:
          BASE_URL: http://localhost:3000
          DATABASE_URL: postgresql://test:test@localhost:5432/smart-menu-test
          JWT_SECRET: test-secret-for-ci-min-32-chars-long
          NEXT_PUBLIC_DOMAIN: http://localhost:3000
          RATE_LIMIT_RELAX: "1"

      # round85-D2: keep the HTML report + traces when e2e fails (was lost)
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # round86-D2: production QA is now a SEPARATE job — previously it ran with
  # continue-on-error inside the blocking job, and the report upload (if:
  # failure()) ran BEFORE it, so prod-QA failures left zero artifacts.
  prod-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # round87-D10: prod-qa re-downloaded the ~170MB chromium bundle on every
      # main push (only the main job cached ~/.cache/ms-playwright). Same key
      # scheme as that job, so both jobs share one cache entry and the install
      # step below becomes a no-op hit.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Production QA regression (team1/2/5/6)
        id: prodqa
        run: npx playwright test tests/e2e/team1-auth.spec.ts tests/e2e/team2-customer.spec.ts tests/e2e/team5-admin.spec.ts tests/e2e/team6-a11y.spec.ts --project=qa-teams --workers=1
        env:
          BASE_URL: https://menu.smart-link.ly
        continue-on-error: true # never block deploys on flaky rate-limits
      - name: Upload production QA report
        if: always() && steps.prodqa.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: prod-qa-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
