name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# round86-D6: superseded runs are cancelled instead of queueing ~20min each
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# r97-X4: the Node version is now pinned by .nvmrc (major "24"), read via
# node-version-file on every setup-node step. actions/setup-node v4.1+
# resolves a partial major in .nvmrc to the latest matching release — the
# same resolution the old NODE_VERSION="24.x" env gave, with one source of
# truth shared between local (nvm/bun) and CI.

# round86-D6: least-privilege token permissions
permissions:
  contents: read

jobs:
  # TODO(r98): lint-build-test is a 20+ step monolith (gates → build → e2e in
  # one job). Splitting it (lint/typecheck/unit | build+e2e, sharing a build
  # artifact) is documented future debt — do not restructure in passing rounds.
  lint-build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: smart-menu-test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      # round90-F2 (CSO audit F3, HIGH): every `uses:` is pinned to the full
      # 40-char commit SHA of the newest release of the major it was already
      # on — a mutable tag (@v4) can be re-pointed by a compromised account and
      # would silently change CI behavior; a commit SHA cannot. The trailing
      # comment keeps the release readable. To upgrade, resolve the new tag's
      # commit with:
      #   git ls-remote https://github.com/<owner>/<repo> "refs/tags/vX.Y.Z^{}"
      # (^{} peels annotated tags down to the commit; the actions/* v4 tags are
      # lightweight so the ref IS the commit — object types were verified via
      # the GitHub API git/ref endpoint this round).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Project uses pnpm (pnpm-lock.yaml is the only lockfile — no
      # package-lock.json), so CI must install and cache through pnpm too.
      # npm ci fails hard with "Dependencies lock file is not found".
      # round90-F2: THIRD-PARTY action — highest supply-chain priority (audit
      # F3). v4.4.0 is an annotated tag; pinned to its peeled commit.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # r97-X4: .nvmrc (major "24") — partial majors resolve to the
          # latest matching release on setup-node v4.1+
          node-version-file: .nvmrc
          cache: pnpm

      # round88-D6: secret-leak scanner (scripts/check-secrets.mjs) —
      # zero-dependency (node builtins + git), scans every tracked file for
      # GitHub/Vercel/OpenAI tokens and credentialed DB URLs. Placed BEFORE
      # install/build (fail-fast: a leaked token fails the run in seconds,
      # before minutes of dependencies/build); like the .env guard below it
      # is security-relevant and costs ~1s. Exit 1 on any real leak —
      # deliberate dev-only placeholders live in the script's reviewed
      # FILE_ALLOWLIST / inline `allow-secret-check` markers.
      - name: Secrets scan
        run: node scripts/check-secrets.mjs

      # round86-D6: cache the chromium browser between runs (install step
      # below becomes a no-op hit)
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile

      # round86-D6: fail-fast ordering — the committed-.env guard is
      # security-relevant and takes milliseconds; it must not wait behind a
      # multi-minute build
      - name: Check for committed .env files
        run: |
          STAGED=$(git ls-files '.env' '.env.local' '.env.prod' '.env.development')
          if [ -n "$STAGED" ]; then
            echo "❌ SECURITY BLOCKED: .env files are tracked:"
            echo "$STAGED"
            exit 1
          fi

      # round86-D7: dependency audit (prod tree) — new advisories fail CI
      - run: pnpm audit --prod

      # prisma.config.ts resolves DATABASE_URL at load time (PrismaConfigEnvError
      # otherwise), even for `generate` which never touches the DB — a dummy URL
      # satisfies the config loader in CI.
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/smart-menu-test

      # round87-D10: migration parity gate — schema.prisma must match what the
      # migrations directory actually produces. `prisma migrate diff` replays
      # ALL migrations into a scratch shadow DB on the SAME postgres service
      # and diffs the result against the datamodel; --exit-code makes any drift
      # (hand-written migration SQL whose names/objects differ from the schema,
      # or a schema edit shipped without a migration) fail CI with exit 2.
      # Incantation documented in docs/ops-runbook.md §3. prisma.config.ts reads
      # SHADOW_DATABASE_URL, and DATABASE_URL is required at config-load time.
      - name: Migration parity gate (migrations ↔ schema.prisma)
        run: |
          node -e "const {Client}=require('pg');(async()=>{const c=new Client({connectionString:process.env.DATABASE_URL});await c.connect();await c.query('DROP DATABASE IF EXISTS \"smart-menu-shadow\"');await c.query('CREATE DATABASE \"smart-menu-shadow\"');await c.end();})().catch((e)=>{console.error(e);process.exit(1)})"
          pnpm exec prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema prisma/schema.prisma \
            --exit-code
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/smart-menu-test
          SHADOW_DATABASE_URL: postgresql://test:test@localhost:5432/smart-menu-shadow

      # Schema must exist before build: /menu/[slug] generateStaticParams reads
      # the DB at build time (TableDoesNotExist otherwise). Use the SAME channel
      # as production — `prisma migrate deploy` (package.json build runs it too):
      # a previous `prisma db push` step created the schema WITHOUT the
      # _prisma_migrations table, so the build's own `migrate deploy` then failed
      # with P3005 ("database schema is not empty") on every CI run.
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/smart-menu-test

      # CI/local seed (admin + default plans) without the /api/seed admin-auth
      # chicken-and-egg. E2E auth suites log in as this admin.
      - run: node scripts/ci-seed.mjs
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/smart-menu-test

      # round85-D5: seed a REAL restaurant (al-waha-cafe + 9 items + featured
      # showcase) so localhost e2e menu/cart journeys run against data instead
      # of every /menu/<slug> check passing via the 404 branch.
      # Note: this seed writes a LEGACY-format password hash on purpose —
      # login then exercises the round85-A3 legacy-verify + rehash-on-login path.
      - run: node scripts/round83-seed.mjs
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/smart-menu-test

      # round86-D2: fixture for the localhost deep journeys (qa-teams specs
      # hardcode testmulti1568 + restaurants 313..317 for the IDOR checks)
      - run: node scripts/qa-seed.mjs
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/smart-menu-test

      # round93-S1: simulation-army fixtures — modifier groups on Caramel
      # Latte (customer journey options), r93_sim_sa (sub_admin, zero
      # permissions — reviews-PII gate) and r93_sim_root (super_admin —
      # admin journey + UI sub_admin creation). Idempotent.
      - run: node scripts/r93-sim-seed.mjs
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/smart-menu-test

      - run: npm run lint

      # round85-D2: typecheck was never in CI (tsconfig excludes tests/e2e,
      # scripts — those are checked by their own runners)
      - run: npm run typecheck

      # round92-D9: knip as an ADVISORY-ONLY step — documents dependency /
      # dead-code drift in every CI run WITHOUT gating it. knip has known
      # false positives on this repo (19 round-scripts are intentional
      # audit-trail evidence, knip.config.ts documents the ignore policy) and
      # real findings (dead exports, unlisted deps) are triaged manually in
      # the round reviews instead of blocking merges. Output lands in the
      # Actions log for review; continue-on-error keeps it non-blocking.
      # Knip is an exact-pinned devDependency (5.46.4) — no version drift.
      - name: Knip advisory (dead-code / dependency drift report)
        run: npx knip
        continue-on-error: true

      # round85-A7 (hardened round86-A12 to PER-HANDLER checks): every exported
      # HTTP handler must be session-gated, secret-gated, or a documented
      # public endpoint — catches "forgot requireAuth on one verb" regressions
      - run: node scripts/check-api-auth.mjs

      # round86-D5: coverage WITH thresholds — `npm test` (plain run) never
      # executed the ratchet, so a 0%-covered module failed nothing
      - run: npm run test:coverage
        env:
          TELEGRAM_BOT_TOKEN: "test"
          TELEGRAM_CHAT_ID: "0"

      # round89-D2: coverage report (lcov.info + html/) as an artifact — was
      # computed in every run but never uploaded, so a red ratchet or a
      # coverage drop could only be read from the raw log. Short retention (7d)
      # like the other reports.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      # Build-time env validation (src/lib/env.ts) throws in production mode —
      # supply CI-safe values so page-data collection can import API routes.
      # These are placeholders only; the E2E server step sets its own.
      - run: npm run build
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/smart-menu-test
          JWT_SECRET: test-secret-for-ci-min-64-chars-long-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          AUTH_SECRET: test-auth-secret-for-ci-min-32-chars
          NEXT_PUBLIC_DOMAIN: http://localhost:3000
          NEXT_PUBLIC_WHATSAPP_NUMBER: "218900000000"

      # Start server for E2E tests (always runs, uses CI Postgres service).
      # Standalone server (output: standalone) — `next start` warns and can
      # misbehave with it. NOTE: the standalone server is a NEW process —
      # build-time env does NOT carry over, and src/lib/env.ts validates
      # NEXT_PUBLIC_WHATSAPP_NUMBER at RUNTIME too; without it every
      # env-validating route 500s (verified: CI run 498 webhook/login tests).
      # round94-W3-fix: wait-on was REMOVED from devDependencies as "unused"
      # (F-report: zero refs in TS/JS) but it WAS used here and in
      # nightly-flake.yml — the audit missed YAML workflows. Rather than
      # restoring the dependency, replace it with the native curl wait-loop
      # (same battle-tested pattern as scripts/r92-e2e-local.sh): zero
      # registry fetch, zero dependency, zero supply-chain surface — strictly
      # better than round87-D3's pinned-devDependency rationale.
      - name: Start server for E2E
        run: |
          node .next/standalone/server.js &
          for i in $(seq 1 60); do
            if curl -s -o /dev/null http://localhost:3000/api/health --max-time 3; then break; fi
            sleep 1
          done
          curl -s -o /dev/null -w "e2e server health: %{http_code}\n" http://localhost:3000/api/health --max-time 5
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/smart-menu-test
          JWT_SECRET: test-secret-for-ci-min-64-chars-long-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          AUTH_SECRET: test-auth-secret-for-ci-min-32-chars
          NEXT_PUBLIC_DOMAIN: http://localhost:3000
          NEXT_PUBLIC_WHATSAPP_NUMBER: "218900000000"
          TELEGRAM_BOT_TOKEN: "test"
          # round94 (W1-b/fix 4 — revive 3 dead webhook-security tests): the
          # suite's positive-auth cases skip unless TELEGRAM_WEBHOOK_SECRET is
          # resolvable — CI has no .env, so it never existed here and 3 tests
          # skipped on EVERY run since r93. The route reads the secret per-request
          # (fail-closed) so the SERVER must enforce the SAME value the test
          # process sends. Dummy localhost-only value — public repo, never a real
          # secret (production sets its own via Vercel env; .env.example documents
          # the local-run variant).
          TELEGRAM_WEBHOOK_SECRET: "ci-local-e2e-webhook-secret"
          # round92 flake fix: the standalone server forces NODE_ENV=production,
          # so RATE_LIMIT_RELAX=1 (test-process env below) could never widen the
          # server-side buckets — all register/login e2e specs shared one
          # 5/min/IP bucket → 429 flakes (run 34095732086, nightly FLAKY
          # verdict). TEST_RELAX works under production NODE_ENV, is set ONLY
          # here (never on Vercel), and still honors exemptFromRelax lockouts.
          RATE_LIMIT_TEST_RELAX: "1"

      # E2E tests against localhost (not production).
      # DB-backed via the CI Postgres service at top of this job.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests (core projects)
        run: npm run test:e2e
        env:
          BASE_URL: http://localhost:3000
          DATABASE_URL: postgresql://test:test@localhost:5432/smart-menu-test
          JWT_SECRET: test-secret-for-ci-min-64-chars-long-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          NEXT_PUBLIC_DOMAIN: http://localhost:3000
          # round94 (W1-b/fix 4): must match the e2e SERVER's secret above so the
          # 3 positive-auth webhook tests actually authenticate (was: always skipped).
          TELEGRAM_WEBHOOK_SECRET: "ci-local-e2e-webhook-secret"
          # round94 (W1-b/fix 4): the server under test is the standalone
          # PRODUCTION build — HSTS specs send x-forwarded-proto: https (the
          # documented TLS-terminating-proxy path) and assert the header; dev
          # servers (no HSTS by design) skip honestly. Test-process marker only.
          E2E_SERVER_MODE: production
          # r93: يطابق حالة الخادم (TRIM relax ×200 أعلاه) — مواصفة المخرب
          # r93-sim-abuser تتخطى اختبارَي الضغط 429 في البيئة المرخّصة (الميزانية
          # ×200 غير قابلة للبلوغ عمليًا) وتحتفظ ببقية الفحوص الحية.
          RATE_LIMIT_TEST_RELAX: "1"

      # round86-D2: the deep journeys (payments/owner-CRUD/IDOR/personas) were
      # LOCAL-ONLY before — CI never executed ~63 cases, including the
      # team4 payments flow and the round80/86 security suites. Runs against
      # the same CI server (seeds already loaded), so it is a BLOCKING gate.
      # workers=2 (vs the golden workers=1): safe ONLY in this step because
      # the server-side login/limiter budgets are already widened by
      # RATE_LIMIT_TEST_RELAX=1 (set on the "Start server for E2E" step — the
      # ONLY relax var that survives the standalone server's production
      # NODE_ENV) and each team persona logs in under its own username (bucket
      # is ip:username) — the golden rule targets the serialized team budget,
      # not correctness.
      # r97-X4 (comment fix, no functional change): the RATE_LIMIT_RELAX=1 env
      # kept below is INERT against this production-mode server (relaxation
      # never came from it — see the round92 flake-fix note on the server
      # step). Both vars stay exactly as they were.
      - name: E2E deep journeys (qa-teams + security suites, localhost)
        run: npx playwright test --project=qa-teams --project=round79-c --workers=2
        env:
          BASE_URL: http://localhost:3000
          DATABASE_URL: postgresql://test:test@localhost:5432/smart-menu-test
          JWT_SECRET: test-secret-for-ci-min-64-chars-long-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          NEXT_PUBLIC_DOMAIN: http://localhost:3000
          RATE_LIMIT_RELAX: "1"
          # round94 (W1-b/fix 4): production-mode server marker — revives the
          # HSTS assertion in round80-security S7 (see core-projects step note).
          E2E_SERVER_MODE: production

      # round85-D2: keep the HTML report + traces when e2e fails (was lost)
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # r103-D6: the mobile app had NO CI job — typecheck/lint/bundle were run
  # manually per round only, so a regression in mobile/ could land silently
  # while every web gate was green. Blocking gates mirror the manual r102
  # verification exactly (typecheck + eslint + Metro/Hermes export); doctor
  # stays advisory (registry-dependent, flaky as a gate).
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # No explicit version here: the action reads the ROOT packageManager
      # (pnpm@11.9.0), and pnpm's manage-package-manager-versions then honors
      # mobile/package.json's own packageManager (10.34.5) inside mobile/ —
      # the exact behavior of a local bare `pnpm` in that directory
      # (verified: local install prints "using pnpm v10.34.5"). Pinning BOTH
      # makes action-setup fail with "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      # .npmrc forces node-linker=hoisted (RN autolinking) — same install the
      # EAS build uses.
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # eslint-config-expo still ships the legacy eslintrc format — the repo's
      # mobile lint script pins ESLINT_USE_FLAT_CONFIG=false for it.
      - run: pnpm lint

      # The strongest signal short of an EAS build: a full Metro/Hermes export
      # catches broken imports/resolution that tsc alone can miss.
      - name: Metro bundle export (android)
        run: npx expo export --platform android

      - name: expo-doctor (advisory)
        run: npx expo-doctor
        continue-on-error: true

  # round86-D2: production QA is now a SEPARATE job — previously it ran with
  # continue-on-error inside the blocking job, and the report upload (if:
  # failure()) ran BEFORE it, so prod-QA failures left zero artifacts.
  prod-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # r97-X4: .nvmrc (major "24") — partial majors resolve to the
          # latest matching release on setup-node v4.1+
          node-version-file: .nvmrc
          cache: pnpm

      # round87-D10: prod-qa re-downloaded the ~170MB chromium bundle on every
      # main push (only the main job cached ~/.cache/ms-playwright). Same key
      # scheme as that job, so both jobs share one cache entry and the install
      # step below becomes a no-op hit.
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      # round89-D2: team9-perf-smoke added — its budgets are production-ready
      # (IS_REMOTE widens the /api/stats budget for the TLS+edge+Neon leg, and
      # it logs in as the qa-seed owner that exists on production too).
      - name: Production QA regression (team1/2/5/6/9)
        id: prodqa
        run: npx playwright test tests/e2e/team1-auth.spec.ts tests/e2e/team2-customer.spec.ts tests/e2e/team5-admin.spec.ts tests/e2e/team6-a11y.spec.ts tests/e2e/team9-perf-smoke.spec.ts --project=qa-teams --workers=1
        env:
          BASE_URL: https://menu.smart-link.ly
        continue-on-error: true # never block deploys on flaky rate-limits
      - name: Upload production QA report
        if: always() && steps.prodqa.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: prod-qa-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
