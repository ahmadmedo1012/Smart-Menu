name: Keep Website Alive

on:
  schedule:
    # r117-F3: كان `*/15` (96 تشغيلًا/يوم ≈ 2880 دقيقة/شهر) واستهلك وحده
    # ما يقارب حصة الخطة — ساهم في بلوغ 4374 دقيقة في سبتمبر ثم حجب كل
    # الـ CI بفشل الفوترة (annotation رسمي: spending limit/payments failed).
    # الواقعية: Neon autosuspend بعد 5 دقائق خمول — ping كل 15 دقيقة لم يكن
    # يبقيها مستيقظة أصلًا إلا ثلث الوقت؛ والصحوة الذاتية عند الطلب سريعة
    # (dbLatencyMs ≈ 30-40 بارد مقابل 3-4 ساخن، موثّق r117).
    # الجدول الجديد (19 تشغيلًا/يوم ≈ 570 دقيقة/شهر، خفض 80%):
    #   * ساعيًا خلال ساعات ذروة المطاعم الليبية 07:00–23:00 UTC
    #     (= 09:00–01:00 بتوقيت طرابلس) — يوقظ Neon قبل أول زائر محتمل
    #     ويراقب DB أثناء كل ساعات العمل.
    #   * قناتان كناري في الساعات الميتة (01:00 و 04:00 UTC) — كشف
    #     الانقطاعات الليلية دون حرق دقائق.
    - cron: '0 7-23 * * *'  # hourly peak window (Libya business hours)
    - cron: '0 1,4 * * *'   # overnight canaries
  # r117-F3: تشغيل يدوي — يسمح بالتحقق فور إصلاح الفوترة دون انتظار cron
  # (ويسمح بإعادة الاختبار بعد أي تعديل على هذا الملف).
  workflow_dispatch:

# round86-D6: least-privilege + cancelled superseded runs
permissions:
  contents: read

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Server
        # r98-deploy-fix: الهدف الآن /api/health لا الرئيسية:
        #   - الرئيسية static (مُولّدة مسبقًا) — ping لا يلمس DB إطلاقًا، فكان
        #     «الإبقاء على الدفء» وهمًا: Neon كان ينام تحت كل الـ pings.
        #   - /api/health يستعلم DB فعليًا (round92: db connected + latency)
        #     ويعيد 503 عند تعطله — فالـ ping الآن يوقظ Neon ويراقب القاعدة
        #     معًا (كشف انقطاع حقيقي لا مجرد استجابة CDN).
        run: |
          CODE=$(curl -s -o /tmp/health.json -w "%{http_code}" --max-time 30 https://menu.smart-link.ly/api/health) || CODE="000"
          echo "HTTP $CODE"
          cat /tmp/health.json 2>/dev/null || true
          # r97-X4: the check was DECORATIVE — a non-200 (or curl timeout → 000)
          # only emitted ::warning::, so the badge stayed green through real
          # outages. Now the step FAILS (exit 1) so the badge reflects reality;
          # the ::error:: annotation keeps the status code visible in the
          # Actions summary without log-diving.
          if [ "$CODE" != "200" ]; then
            echo "::error::menu.smart-link.ly/api/health returned HTTP $CODE (expected 200)"
            exit 1
          fi
