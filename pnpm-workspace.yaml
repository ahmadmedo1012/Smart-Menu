allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

# round86-D7: supply-chain protection — only install packages published at
# least 24h ago (defends against freshly-published malicious versions).
# r93 (W2-b / تقرير 1-f §2): المفتاح فُقد أثناء تخريب جلسة r92 فانطفأ الدرع
# (قُبلت تجريبيًا حزمة عمرها 75 دقيقة) — أُعيد بنفس قيمة r86/r90:
# 1440 دقيقة = 24 ساعة. التقييم يشمل الإصدارات الجديدة فقط، فلا يمس القفل الحالي.
minimumReleaseAge: 1440
# Pre-dates the setting (r86 era): pinned-fresh hono at the time; now that the
# age gate is restored this list is ACTIVE (not inert) — these are the only
# versions exempt from the 24h gate.
minimumReleaseAgeExclude:
  - hono@4.13.3

overrides:
  # P26-C: zod 4.3.6 → 4.6.7 — GHSA-mrhx-c7xc-m3w5 (memory-exhaustion in oversized
  # constrained collections; the same advisory SmartBot retired at 2d40900).
  # The knip>zod v3 carve-out below is untouched.
  zod: 4.6.7
  # round90-F6: carve-out scoped to knip ONLY — knip@5 (pinned devDep, v6
  # crashes on this env's oxc-parser) builds its CLI schema with the zod v3
  # function API (z.function().args) which zod 4 removed, so the global
  # zod->4.3.6 override above breaks the locally-installed knip. This gives
  # knip's own subtree the zod v3 it declares. Everything else keeps 4.3.6.
  'knip>zod': ^3.25.76
  postcss: 8.5.26
  nanoid: ^3.3.18
  hono: ^4.13.11  # W7-J (P0): GHSA-5r4p-p66f-jhc7 serveStatic double-decode (moderate) via @prisma/dev chain
  # r191 (same chain, second advisory): GHSA-rmxm-3fg6-px4f — serveStatic
  # decodes the request path a SECOND time (moderate; middleware bypass on
  # static paths). Patched upstream at >=2.1.3; the ^1.19.17 pin below was
  # the W7-J fix for the FIRST advisory and is inside the new vulnerable
  # range (>=1.19.10 <2.1.3). Bumped to ^2.1.5 (published 2026-10-13, aged
  # past the minimumReleaseAge gate). Repo flows unaffected: @prisma/dev's
  # consumer is `prisma dev`/studio tooling this repo never runs (CI runs
  # generate + migrate deploy + seeds only — all verified green after the
  # bump). prisma CLI boot (postinstall generate) exercises the tree fine.
  '@hono/node-server': ^2.1.5
  fast-uri: ^3.1.9  # round86-D7 + r123 → P26-C: >=3.1.9 adds percent-encoded-scheme spoofing + suffix-colon injection fixes
  browserslist: ^4.28.7  # round86-D7: fixes OOM + prototype-write advisories (via next/babel chain)
  mysql2: ^3.23.1  # round86-D7: fixes auth-downgrade + zlib advisories (via prisma)
  deepmerge-ts: ^8.0.1
  valibot: ^1.4.2
  sharp: 0.35.5  # r123: CVE-2026-96889 (>=0.35.5)
  undici: 6.29.1  # r123 → P26-C: WebSocket/permessage-deflate (>=6.28.1) + content-encodings DoS + EventSource unbounded-memory (GHSA-xjj6-f33q-929c, GHSA-4qv8-2p9j-2685 — >=6.29.1, via @vercel/blob)
  source-map-js: ^1.2.2  # r123: indexed source-map section offsets advisory (>=1.2.2, via prisma)
  # round88-B8: patch-level fixes for the 5 high advisories in the eslint
  # dev chain (dev-tooling only, zero production-runtime exposure; semver-
  # compatible — same major):
  #   brace-expansion <1.1.18 DoS (GHSA-4g29-xg2q-p4r6 + 14257 bypass)
  #   brace-expansion >=4 <5.0.9 same class via typescript-estree/minimatch 10
  #   js-yaml <4.3.1 quadratic !!omap CPU (GHSA-5p4m-2wfm-xmqj)
  # P42 (B7): the selectors extend for the NEW wave — GHSA-qhr7-859c-m2p7
  # (stack-exhaustion recursion on nested brace groups: <1.1.20 / >=4 <5.0.11
  # patched at 1.1.20 / 5.0.11, both published 2026-09-14, well past the age
  # gate) supersedes the round88 floors — the selectors now carry the newer
  # minimums; same dev-chain-only exposure.
  'brace-expansion@<1.1.20': ^1.1.20
  'brace-expansion@>=4.0.0 <5.0.11': ^5.0.11
  'js-yaml@>=4.0.0 <4.3.1': ^4.3.1
  # P42 (B7): minimatch GHSA-g3hv-75wg-m249 (DoS via globparts amplification,
  # vulnerable <11.0.1, patched ONLY in 11.x) — the eslint ^9 chain resolves
  # 3.1.5 and no parent range can ever reach the fixed major (the same wall
  # Smart-Link root and Smart-Order /mobile hit; Smart-Order's root proved the
  # 11.0.3 override green on eslint 9.39.5 — minimatch 11 is dual CJS/ESM).
  # Dev-tooling only; this is also what stops the failing Dependabot security
  # job (update_not_possible: latest-resolvable 3.1.5 vs 11.0.1 required).
  minimatch: ^11.0.1
  # P42 (B7): vite >=8.1.6 (files outside server.fs.allow could be served —
  # moderate; published 2026-10-06, past the age gate). vite is transitive via
  # vitest (the direct devDep); the override fixes the whole tree without
  # waiting for vitest to re-pin its vite range.
  vite: 8.1.6
  # P42 (B7, accepted): smol-toml <=1.8.0 quadratic parseKey (moderate) rides
  # ONLY inside knip@5.46.4's own subtree (pinned devDep — the round90-F6 zod
  # carve-out's neighbor; parses knip's LOCAL config during `npx knip` runs;
  # zero production exposure). The patched 1.8.1 DOES NOT EXIST on npm yet
  # (latest 1.8.0, published 2026-08-11) — no version to override TO. Accepted
  # as dev-tooling moderate until upstream ships the fix; the failing Dependabot
  # smol-toml job is the same update_not_possible (no patched release).
  # P42 (B7): launch-editor rides vite's dev server only (never production) —
  # the vite ^8.1.6 bump above refreshes the dev-server chain; if the advisory
  # persists after the bump it stays inside the same dev-only accepted class.
