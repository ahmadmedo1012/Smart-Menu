<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>غير متصل بالإنترنت | الربط الذكي</title>
  <meta name="theme-color" content="#FBF7F0" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1D1410" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      /* r127-F3: IBM Plex Sans Arabic first — the 12 Plex woff2 are SW-cached
         via /fonts/fonts.css, so the offline fallback may use the cached face;
         system stack covers a cold cache. */
      font-family: 'IBM Plex Sans Arabic', 'Segoe UI', system-ui, sans-serif;
      background: #FBF7F0;
      color: #241811;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: #fff;
      border-radius: 1.25rem;
      box-shadow: 0 4px 24px rgba(0,0,0,.06);
      padding: 3rem 2rem;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    .icon {
      font-size: 4rem;
      margin-bottom: 1.5rem;
      display: block;
    }
    /* r128-F5: علامة المنتج — آخر فجوة من سجل r127-A1 (لا wordmark).
       الكلمة المستقيمة هي توكن العلامة الموحّد «الربط الذكي | Smart Menu». */
    .brand {
      font-size: .8rem;
      font-weight: 600;
      letter-spacing: .02em;
      color: #6E6C65;
      margin-bottom: 1rem;
      direction: ltr;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: .75rem;
      color: #241811;
    }
    p {
      font-size: 1rem;
      line-height: 1.6;
      color: #6E6C65;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      padding: .75rem 2rem;
      background: #C2452D;
      color: #FFFFFF;
      border: none;
      border-radius: .75rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    .btn:hover { background: #A93A26; }
    .btn:active { background: #8A2B1D; }
    /* r127-F3: Madarek night palette (matches not-found.tsx literals) —
       the app boots dark-first; the offline fallback should too. */
    @media (prefers-color-scheme: dark) {
      body { background: #1D1410; color: #F7EFE2; }
      .card { background: #2A1E15; box-shadow: 0 4px 24px rgba(8,5,3,.45); }
      h1 { color: #F7EFE2; }
      p { color: #8E97B8; }
      .btn { background: #E07856; color: #2A130D; }
      .btn:hover { background: #E98F72; }
      .btn:active { background: #C2452D; }
      .brand { color: #8E97B8; }
    }
  </style>
</head>
<body>
  <div class="card">
    <p class="brand">الربط الذكي | Smart Menu</p>
    <span class="icon">&#x1F4E1;</span>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>يرجى التحقق من اتصالك بالشبكة والمحاولة مرة أخرى. التطبيق سيتم تحميله تلقائياً عند توفر الاتصال.</p>
    <button class="btn" onclick="window.location.reload()">
      &#x21BB; إعادة المحاولة
    </button>
  </div>
</body>
</html>
