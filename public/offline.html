<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>غير متصل بالإنترنت | الربط الذكي</title>
  <meta name="theme-color" content="#FBFAF9" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#070B16" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      /* r127-F3: IBM Plex Sans Arabic first — the 12 Plex woff2 are SW-cached
         via /fonts/fonts.css, so the offline fallback may use the cached face;
         system stack covers a cold cache. */
      font-family: 'IBM Plex Sans Arabic', 'Segoe UI', system-ui, sans-serif;
      background: #FBFAF9;
      color: #191918;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: #fff;
      border-radius: 1.25rem;
      box-shadow: 0 4px 24px rgba(0,0,0,.06);
      padding: 3rem 2rem;
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    .icon {
      font-size: 4rem;
      margin-bottom: 1.5rem;
      display: block;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: .75rem;
      color: #191918;
    }
    p {
      font-size: 1rem;
      line-height: 1.6;
      color: #6E6C65;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      padding: .75rem 2rem;
      background: #B57438;
      color: #1A0F06;
      border: none;
      border-radius: .75rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    .btn:hover { background: #9A5F25; }
    .btn:active { background: #5C3416; }
    /* r127-F3: Madarek night palette (matches not-found.tsx literals) —
       the app boots dark-first; the offline fallback should too. */
    @media (prefers-color-scheme: dark) {
      body { background: #070B16; color: #F2EFE6; }
      .card { background: #0D1428; box-shadow: 0 4px 24px rgba(0,0,0,.45); }
      h1 { color: #F2EFE6; }
      p { color: #8E97B8; }
      .btn { background: #E9B44C; color: #05070F; }
      .btn:hover { background: #F5D48A; }
      .btn:active { background: #C9962F; }
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="icon">&#x1F4E1;</span>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>يرجى التحقق من اتصالك بالشبكة والمحاولة مرة أخرى. التطبيق سيتم تحميله تلقائياً عند توفر الاتصال.</p>
    <button class="btn" onclick="window.location.reload()">
      &#x21BB; إعادة المحاولة
    </button>
  </div>
</body>
</html>
