<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: 'Readex Pro'; src: url('/fonts/readex-pro.woff2') format('woff2'); font-weight: 300 700; font-display: block; }
  @font-face { font-family: 'Readex Pro Latin'; src: url('/fonts/readex-pro-latin.woff2') format('woff2'); font-weight: 300 700; font-display: block; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: 'Readex Pro', sans-serif;
    background:
      radial-gradient(ellipse 900px 520px at 82% -12%, oklch(0.55 0.19 45 / 0.28), transparent 65%),
      radial-gradient(ellipse 700px 400px at 8% 110%, oklch(0.55 0.19 45 / 0.18), transparent 60%),
      #070503;
    color: #ebe7e2;
    display: flex; flex-direction: column; justify-content: center; align-items: flex-start;
    padding: 72px 88px;
    position: relative;
  }
  .grain { position: absolute; inset: 0; opacity: 0.5; background-image: radial-gradient(oklch(0.93 0.008 70 / 0.045) 1px, transparent 1px); background-size: 5px 5px; }
  .brand-row { display: flex; align-items: center; gap: 18px; margin-bottom: 34px; position: relative; }
  .mark { width: 84px; height: 84px; border-radius: 22px; background: linear-gradient(135deg, oklch(0.55 0.19 45), oklch(0.42 0.17 48));
    display: flex; align-items: center; justify-content: center; box-shadow: 0 18px 44px oklch(0.55 0.19 45 / 0.35); }
  .mark svg { width: 46px; height: 46px; }
  .brand-name { font-size: 46px; font-weight: 600; letter-spacing: -0.5px; color: #f5f2ee; }
  h1 { font-size: 88px; font-weight: 700; line-height: 1.08; margin-bottom: 18px; position: relative;
       background: linear-gradient(120deg, #f8f6f3 30%, oklch(0.78 0.14 70)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .tagline { font-size: 34px; font-weight: 300; color: oklch(0.72 0.012 70); margin-bottom: 46px; position: relative; }
  .pills { display: flex; gap: 14px; position: relative; }
  .pill { font-size: 24px; font-weight: 500; color: oklch(0.78 0.14 70); border: 1.5px solid oklch(0.55 0.19 45 / 0.45);
    background: oklch(0.55 0.19 45 / 0.10); border-radius: 999px; padding: 10px 26px; }
  .url { position: absolute; bottom: 54px; left: 88px; font-family: 'Readex Pro Latin', sans-serif; direction: ltr;
    font-size: 26px; font-weight: 500; color: oklch(0.62 0.012 70); letter-spacing: 0.2px; }
  .qr { position: absolute; bottom: 48px; right: 88px; width: 118px; height: 118px; opacity: 0.35;
    background:
      linear-gradient(0deg, transparent 75%, oklch(0.55 0.19 45) 75%) 0 0/24px 24px,
      linear-gradient(90deg, transparent 75%, oklch(0.55 0.19 45) 75%) 0 0/24px 24px,
      oklch(0.93 0.008 70 / 0.5);
    border-radius: 8px;
    -webkit-mask-image: radial-gradient(circle at center, black 72%, transparent 73%);
    mask-image: radial-gradient(circle at center, black 72%, transparent 73%);
  }
</style>
</head>
<body>
  <div class="grain"></div>
  <div class="brand-row">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#f8f6f3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 8h16"/><path d="M4 12h16"/><path d="M4 16h10"/>
        <circle cx="19.5" cy="16" r="1.6" fill="#f8f6f3" stroke="none"/>
      </svg>
    </div>
    <div class="brand-name">الربط الذكي</div>
  </div>
  <h1>منيو رقمي ذكي<br>لمطعمك</h1>
  <div class="tagline">قائمة تفاعلية · طلب عبر واتساب · QR فوري</div>
  <div class="pills">
    <span class="pill">مجاني للتجربة</span>
    <span class="pill">جاهز خلال دقائق</span>
  </div>
  <div class="url">menu.smart-link.ly</div>
  <div class="qr"></div>
</body>
</html>
